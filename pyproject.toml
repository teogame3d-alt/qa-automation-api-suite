[project]
name = "qa-automation-api-suite"
version = "0.1.0"
description = "Python QA automation API test suite with CI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pytest>=8.0",
  "requests>=2.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
